# rekindle dashboard settings (sourced by bin/rekindle.sh; keep UNIX line endings)

# Location for the forecast (decimal degrees) and the label shown on screen.
LATITUDE=35.6837
LONGITUDE=139.6805
PLACE="Tokyo"

# Clock timezone as a POSIX TZ string (the Kindle has no zoneinfo database, so names like
# "Europe/Berlin" silently fall back to UTC). The Kindle's own timezone setting is ignored.
#   Japan JST-9            China CST-8              India IST-5:30
#   Sydney AEST-10AEDT,M10.1.0,M4.1.0/3             Central Europe CET-1CEST,M3.5.0,M10.5.0/3
#   UK GMT0BST,M3.5.0/1,M10.5.0                     US Eastern EST5EDT,M3.2.0,M11.1.0
#   US Pacific PST8PDT,M3.2.0,M11.1.0
TZ_POSIX="JST-9"
# The same zone as an IANA name; Open-Meteo uses it to line up hourly forecasts.
TZ_IANA="Asia/Tokyo"

# Fetch weather every N minutes (Open-Meteo's current data updates every 15 min). Each
# fetch powers the wifi radio for about 15 s, so a longer interval saves battery.
WEATHER_MINUTES=30

# Hours of rain forecast to check, starting with the current hour. When any of them is
# rainy the screen shows a rain banner (and, in the simplistic layout, an hourly chart).
RAIN_LOOKAHEAD_HOURS=12
# An hour counts as rainy when its precipitation probability reaches this (%),
# or its forecast precipitation is at least 0.1 mm.
RAIN_PROBABILITY=50

# Train status (the "with train status" layout): during TRAIN_HOURS a gray band shows when
# this JR East line is delayed (JR lists delays of 30+ minutes), suspended or partly
# cancelled, read from JR East's English Kanto status page with each weather fetch.
# TRAIN_LINE is the line symbol on the station signs, e.g. JK Keihin-Tohoku, JY Yamanote,
# JC Chuo Rapid, JT Tokaido, JO Yokosuka. TRAIN_HOURS is START-END in whole hours
# (not wrapping past midnight).
TRAIN_LINE=JK
TRAIN_HOURS=6-9

# Between these, each minute repaints only the clock (and the status bar when it changes).
# Every N minutes the whole screen is redrawn with a flash to clear e-ink ghosting.
FULL_REFRESH_MINUTES=15

# Resync the system clock against this NTP server once an hour.
NTP_SERVER="ntp.nict.jp"

# Battery saving: between minute ticks the Kindle suspends (an RTC alarm wakes it each
# minute) and wifi is only on for the weather fetch and NTP sync.
#   auto    on battery only; while charging it stays awake and online, so SSH works
#   always  also while charging (SSH is unreachable between fetches)
#   never   stay awake with wifi always on
LOW_POWER=auto

# Quiet hours (battery only): between these hours the clock is repainted, and the Kindle
# wakes, only every QUIET_MINUTES instead of every minute, so the clock lags by up to that
# long. START-END in whole hours, e.g. 23-6 (may wrap past midnight); empty disables.
# QUIET_MINUTES: 1, 2, 3, 4, 5, 6, 10, 12, 15, 20 or 30 (anything else disables quiet
# hours). The full-screen flash only happens on ticks, so with 10 it is every 30 minutes.
# While charging, quiet hours have no effect.
QUIET_HOURS=""
QUIET_MINUTES=10
