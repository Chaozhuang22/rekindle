# rekindle dashboard settings (sourced by bin/rekindle.sh; keep UNIX line endings)

# Location for the forecast (decimal degrees) and the label shown on screen.
LATITUDE=35.6837
LONGITUDE=139.6805
PLACE="Tokyo"

# POSIX TZ string for the clock. The Kindle's own timezone setting is ignored.
# Japan: JST-9 (UTC+9, no DST).
TZ_POSIX="JST-9"
# IANA name passed to Open-Meteo so hourly forecasts line up with local time.
TZ_IANA="Asia/Tokyo"

# Fetch weather every N minutes (Open-Meteo's current data updates every 15 min).
WEATHER_MINUTES=15

# Look this many hours ahead when deciding "rain" vs "no rain".
RAIN_LOOKAHEAD_HOURS=3
# An hour counts as rainy when its precipitation probability reaches this (%),
# or its forecast precipitation is at least 0.1 mm.
RAIN_PROBABILITY=50

# Flash the whole screen every N minutes to clear e-ink ghosting.
FULL_REFRESH_MINUTES=15

# Resync the system clock against this NTP server once an hour.
NTP_SERVER="ntp.nict.jp"
